<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Shop admin</title>
<style>
:root{--fg:#1a1a1a;--muted:#6b6b6b;--line:#e3e3e3;--bg:#fff;--card:#f6f6f4;--accent:#111;--accent-fg:#fff;--err:#b42318;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--fg:#ededed;--muted:#a0a0a0;--line:#2c2c2c;--bg:#121212;--card:#1c1c1c;--accent:#f2f2f2;--accent-fg:#111;--err:#ff6b5e}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
nav{display:flex;gap:8px;margin-bottom:16px}
button{font:inherit;cursor:pointer;border:0;border-radius:6px;padding:.45em 1em;background:var(--accent);color:var(--accent-fg)}
button.ghost{background:var(--card);color:var(--fg)}
table{width:100%;border-collapse:collapse}
td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500}
input,textarea,select{font:inherit;padding:.45em;border:1px solid var(--line);border-radius:6px;width:100%;background:var(--bg);color:var(--fg)}
form.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;padding:16px;background:var(--card);border-radius:8px;margin-bottom:16px}
form.grid .wide{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
.error{color:var(--err)}
.muted{color:var(--muted)}
.table-scroll{overflow-x:auto}
</style>
</head>
<body>
<div class="wrap">
<h1>Shop admin</h1>
<form id="login" hidden><label>Admin token<input type="password" name="token" required autocomplete="current-password"></label><p><button>Sign in</button></p></form>
<div id="app" hidden>
<nav><button class="ghost" data-tab="products">Products</button><button class="ghost" data-tab="orders">Orders</button><button class="ghost" id="logout">Sign out</button></nav>
<p class="error" id="error" role="alert"></p>
<section id="products" hidden>
<form class="grid" id="product-form">
<input type="hidden" name="id">
<label>Name<input name="name" required></label>
<label>Slug<input name="slug" required pattern="[a-z0-9]+(-[a-z0-9]+)*"></label>
<label>Price (incl. VAT)<input name="price" type="number" step="0.01" min="0" required></label>
<label>VAT %<input name="tax_rate" type="number" step="0.01" min="0" max="100" value="25"></label>
<label>Stock (empty = unlimited)<input name="stock" type="number" min="0"></label>
<label>Visible<select name="active"><option value="true">Yes</option><option value="false">No</option></select></label>
<label class="wide">Image URL<input name="image" placeholder="https://…"></label>
<label class="wide">Description<textarea name="description" rows="4"></textarea></label>
<div class="wide"><button id="save">Add product</button> <button type="reset" class="ghost">Clear</button></div>
</form>
<div class="table-scroll"><table><thead><tr><th>Name</th><th>Price</th><th>Stock</th><th>Visible</th><th></th></tr></thead><tbody id="product-rows"></tbody></table></div>
</section>
<section id="orders" hidden>
<div class="table-scroll"><table><thead><tr><th>#</th><th>Date</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody id="order-rows"></tbody></table></div>
</section>
</div>
</div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const money = (m, cur = '') => (m / 100).toFixed(2) + (cur ? ' ' + cur : '');
let token = sessionStorage.getItem('adminToken');
let products = [];

async function api(method, path, body) {
  const res = await fetch('/api/admin' + path, {
    method,
    headers: { Authorization: 'Bearer ' + token, ...(body ? { 'Content-Type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { logout(); throw new Error('Wrong token'); }
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
const guard = (fn) => async (...a) => { $('#error').textContent = ''; try { await fn(...a); } catch (e) { $('#error').textContent = e.message; } };

function logout() { token = null; sessionStorage.removeItem('adminToken'); $('#app').hidden = true; $('#login').hidden = false; }
$('#logout').onclick = logout;
$('#login').onsubmit = guard(async (e) => {
  e.preventDefault();
  token = new FormData(e.target).get('token');
  await api('GET', '/products');
  sessionStorage.setItem('adminToken', token);
  start();
});

function show(tab) {
  for (const t of ['products', 'orders']) $('#' + t).hidden = t !== tab;
  (tab === 'products' ? loadProducts : loadOrders)();
}
document.querySelectorAll('[data-tab]').forEach((b) => { b.onclick = () => show(b.dataset.tab); });

const loadProducts = guard(async () => {
  products = await api('GET', '/products');
  $('#product-rows').innerHTML = products.map((p) => `<tr>
<td><a href="/p/${esc(p.slug)}/" target="_blank">${esc(p.name)}</a></td><td>${money(p.price)}</td>
<td>${p.stock ?? '∞'}</td><td>${p.active ? 'Yes' : 'No'}</td>
<td><button class="ghost" data-edit="${p.id}">Edit</button> <button class="ghost" data-del="${p.id}">Delete</button></td></tr>`).join('');
});

$('#product-rows').onclick = guard(async (e) => {
  const edit = e.target.dataset.edit, del = e.target.dataset.del;
  if (edit) {
    const p = products.find((x) => x.id == edit), f = $('#product-form');
    f.elements.id.value = p.id; f.elements.name.value = p.name; f.elements.slug.value = p.slug; f.elements.price.value = (p.price / 100).toFixed(2);
    f.elements.tax_rate.value = p.tax_rate / 100; f.elements.stock.value = p.stock ?? ''; f.elements.active.value = String(!!p.active);
    f.elements.image.value = p.image; f.elements.description.value = p.description;
    $('#save').textContent = 'Save changes';
    f.scrollIntoView({ behavior: 'smooth' });
  }
  if (del && confirm('Delete this product? Existing orders keep their copy of it.')) {
    await api('DELETE', '/products/' + del);
    loadProducts();
  }
});

$('#product-form').onreset = () => { $('#save').textContent = 'Add product'; $('#product-form').elements.id.value = ''; };
$('#product-form').elements.name.oninput = (e) => {
  const f = e.target.form;
  if (!f.elements.id.value) f.elements.slug.value = e.target.value.toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
};
$('#product-form').onsubmit = guard(async (e) => {
  e.preventDefault();
  const f = e.target;
  const body = {
    name: f.elements.name.value, slug: f.elements.slug.value, description: f.elements.description.value, image: f.elements.image.value.trim(),
    price: Math.round(Number(f.elements.price.value) * 100), tax_rate: Math.round(Number(f.elements.tax_rate.value) * 100),
    stock: f.elements.stock.value === '' ? null : Number(f.elements.stock.value), active: f.elements.active.value === 'true',
  };
  if (f.elements.id.value) await api('PATCH', '/products/' + f.elements.id.value, body); else await api('POST', '/products', body);
  f.reset();
  loadProducts();
});

const loadOrders = guard(async () => {
  const orders = await api('GET', '/orders');
  $('#order-rows').innerHTML = orders.map((o) => `<tr>
<td>${o.id}</td><td class="muted">${esc(o.created_at)}</td>
<td>${esc(o.customer.given_name)} ${esc(o.customer.family_name)}<br><span class="muted">${esc(o.email)}<br>
${esc(o.customer.street_address)}, ${esc(o.customer.postal_code)} ${esc(o.customer.city)}</span></td>
<td>${o.lines.filter((l) => l.type === 'physical').map((l) => `${l.quantity} × ${esc(l.name)}`).join('<br>')}</td>
<td>${money(o.amount, o.currency)}</td><td>${esc(o.status)}</td>
<td>${o.status === 'authorized' ? `<button data-capture="${o.id}">Mark shipped</button> ` : ''}
${['authorized', 'pending'].includes(o.status) ? `<button class="ghost" data-cancel="${o.id}">Cancel</button>` : ''}</td></tr>`).join('')
    || '<tr><td colspan="7" class="muted">No orders yet.</td></tr>';
});
$('#order-rows').onclick = guard(async (e) => {
  const { capture, cancel } = e.target.dataset;
  if (capture && confirm('Mark as shipped? This captures the payment with Klarna.')) await api('POST', `/orders/${capture}/capture`);
  else if (cancel && confirm('Cancel this order? The Klarna authorization is released.')) await api('POST', `/orders/${cancel}/cancel`);
  else return;
  loadOrders();
});

function start() { $('#login').hidden = true; $('#app').hidden = false; show('orders'); }
if (token) start(); else logout();
</script>
</body>
</html>
