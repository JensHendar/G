<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sikte – skjutbana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lilita+One&display=swap">
<link rel="stylesheet" href="sikte.css">
</head>
<body class="screen lobby">
<canvas id="c"></canvas>

<div class="hud">
  <ol class="board" id="board"></ol>
  <div class="timer" id="timer"></div>
  <button class="btn sound" id="sound" aria-label="Slå på ljud">🔇</button>
</div>

<aside class="join" id="join">
  <h1>Sikte</h1>
  <p class="lead">Använd telefonen som vapen.</p>
  <div class="qr" id="qr"><span class="spinner"></span></div>
  <p class="code">Rumskod <b id="code">…</b></p>
  <p class="hint" id="join-url"></p>
  <p class="status" id="status">Ansluter till servern…</p>
</aside>

<div class="results" id="results" hidden></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="skarm.js"></script>
</body>
</html>
