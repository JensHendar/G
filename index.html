<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kingdom Clicker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lilita+One&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--BODY-->
<div class="app">
  <header class="bar">
    <h1><small>Kingdom Clicker</small><span id="realm-title">Hamlet of Oakhollow</span></h1>
    <span class="season" id="season">🌸 Spring</span>
    <div class="bar-actions">
      <button class="btn" id="open-realm">📜 Realm</button>
      <button class="btn" id="open-charters">👑 Charters</button>
      <button class="btn icon" id="mute" aria-label="Turn sound off">🔊</button>
    </div>
  </header>

  <main class="main">
    <section class="stage" aria-label="Your realm">
      <div class="purse">
        <div class="amount"><span id="money">0</span> <span>gold</span></div>
        <div class="rate" id="cps">0 gold per second</div>
        <div class="rank" id="rank-progress">
          <div class="rank-bar"><div class="rank-fill" id="rank-fill"></div></div>
          <div class="rank-label" id="rank-label"></div>
        </div>
        <div class="buffs" id="buffs"></div>
      </div>
      <canvas id="world" tabindex="0" role="button" aria-label="Collect taxes. Press Space or Enter to click."></canvas>
      <div class="chronicle" aria-live="off"><span class="chronicle-label">Chronicle</span><span id="chronicle-text"></span></div>
    </section>

    <section class="shop" aria-label="Shop">
      <h2>Upgrades <span class="count" id="upgrade-count"></span></h2>
      <div class="upgrades" id="upgrades"></div>
      <div class="upgrade-info" id="upgrade-info"></div>
      <p class="season-blurb" id="season-blurb"></p>
      <h2>
        Hire
        <span class="amounts" role="group" aria-label="Buy amount">
          <button data-amt="1" aria-pressed="true">×1</button>
          <button data-amt="10" aria-pressed="false">×10</button>
          <button data-amt="100" aria-pressed="false">×100</button>
          <button data-amt="max" aria-pressed="false">Max</button>
        </span>
      </h2>
      <div class="professions" id="professions"></div>
    </section>
  </main>
</div>

<div class="overlay" id="modal" hidden>
  <div class="sheet" id="modal-sheet" role="dialog" aria-modal="true" aria-label="Realm">
    <button class="close" id="modal-close" aria-label="Close">✕</button>
    <div id="modal-body"></div>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<!--/BODY-->
<script src="kingdom.js"></script>
<script src="game.js"></script>
</body>
</html>
